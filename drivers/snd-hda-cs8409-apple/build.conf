# Build options for snd-hda-cs8409-apple (read by dkms-build.sh).
# Edit /usr/src/snd-hda-cs8409-apple-<ver>/build.conf, then rebuild with
#   sudo dkms remove snd-hda-cs8409-apple/<ver> --all && sudo dkms install snd-hda-cs8409-apple/<ver>

# Same flags as davidjo/snd_hda_macbookpro Makefile ("normal build flags").
# -DCONFIG_SND_HDA_RECONFIG=1 is only added if the target kernel has CONFIG_SND_HDA_RECONFIG=y
# (it changes struct hda_codec, so it must match the kernel).
APPLE_CFLAGS="-DAPPLE_PINSENSE_FIXUP -DAPPLE_CODECS -Wno-unused-variable -Wno-unused-function"

# Upstream alternative ("internal mike only", see davidjo commit 89b22ff):
#APPLE_CFLAGS="-DINTERNAL_MIKE_ONLY -DAPPLE_PINSENSE_FIXUP -DAPPLE_CODECS -Wno-unused-variable -Wno-unused-function"

# If no matching kernel source is vendored/cached/installed, fetch the Ubuntu
# linux-source package for exactly that ABI with `apt-get download` (signed apt
# metadata, ~190 MB once per kernel ABI). Set to "no" to forbid network access.
ALLOW_APT_DOWNLOAD=yes

# Where extracted per-ABI source subsets are cached (only used when writable).
CACHE_DIR=/var/cache/snd-hda-cs8409-apple
