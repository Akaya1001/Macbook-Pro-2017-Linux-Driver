PACKAGE_NAME="snd-hda-cs8409-apple"
PACKAGE_VERSION="0.2.89b22ff"

# Builds a replacement snd-hda-codec-cs8409.ko (davidjo/snd_hda_macbookpro 89b22ff,
# Apple CS8409 support) against the Ubuntu source of exactly the target kernel ABI.
MAKE[0]="bash ./dkms-build.sh ${kernelver} ${kernel_source_dir}"
CLEAN="bash ./dkms-build.sh --clean"

BUILT_MODULE_NAME[0]="snd-hda-codec-cs8409"
BUILT_MODULE_LOCATION[0]="build/hda/codecs/cirrus/"
# Ubuntu's dkms installs to /lib/modules/<kver>/updates/dkms regardless; depmod
# searches "updates" before the in-tree "kernel" dir, so this overrides the stock module.
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Only kernels with the >= 6.17 sound/hda/codecs/cirrus layout (patches target 7.0).
BUILD_EXCLUSIVE_KERNEL="^7\.0\.0-[0-9]+-"
BUILD_EXCLUSIVE_CONFIG="CONFIG_SND_HDA_CODEC_CS8409"
AUTOINSTALL="yes"
