# MacBook Pro 2017 (CS8409): the internal microphone is ~25 dB too quiet.
# Virtual microphone "Microphone (boosted + noise filter)" with WebRTC noise suppression,
# echo cancellation, high-pass filter and automatic gain control.
# The extra gain (+24 dB) comes from the hardware source volume (set to 2.5 by the installer).
# NOTE: do not add node.dont-reconnect – the module would unload itself when WirePlumber restarts.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name  = aec/libspa-aec-webrtc
      node.latency  = 1024/48000
      audio.rate    = 48000
      audio.channels = 1
      audio.position = [ MONO ]
      monitor.mode  = true
      capture.props = {
        node.name      = "capture.mic-clean"
        target.object  = "alsa_input.pci-0000_00_1f.3.analog-stereo"
        node.passive   = true
      }
      source.props = {
        node.name        = "mic-clean"
        node.description = "Microphone (boosted + noise filter)"
        priority.session = 2000
      }
      aec.args = {
        webrtc.high_pass_filter  = true
        webrtc.noise_suppression = true
        webrtc.experimental_ns   = true
        webrtc.extended_filter   = true
        webrtc.delay_agnostic    = true
        webrtc.gain_control      = true
        webrtc.experimental_agc  = true
      }
    }
  }
]
