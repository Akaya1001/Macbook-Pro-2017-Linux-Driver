# Apple T1 Touch Bar.
# fnmode: 0 = F-keys only, 1 = special keys (Fn -> F-keys), 2 = F-keys (Fn -> special), 3 = special only
# idle_timeout: seconds until the bar turns off (-1 = never, -2 = bar disabled; NEVER use 0)
# dim_timeout: -2 = automatic
options apple_ibridge skip_acpi_power=1
options apple_ib_tb fnmode=1 idle_timeout=300 dim_timeout=-2
softdep apple_ib_tb pre: apple_ibridge
softdep apple_ib_als pre: apple_ibridge industrialio-triggered-buffer
